name: Task
description: A change delivered by one pull request
title: "type(scope): summary"
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why the change is needed and where it fits.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Each criterion becomes a test or check before any implementation.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: false
